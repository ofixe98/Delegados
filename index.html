<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172033"><link rel="manifest" href="manifest.webmanifest"><title>Delegado AFL V9</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:720px;margin:auto;padding:18px 16px 90px}.top,.head,.row{display:flex;align-items:center}.top{justify-content:space-between}.head{gap:10px}.title{font-size:30px;font-weight:900}.h2{font-size:23px;font-weight:900}.muted{color:#667085;font-size:13px}.card,.task,.occ{background:#fff;border:1px solid #e1e5ea;border-radius:16px;padding:14px;margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin-top:9px;background:#172033;color:#fff;font-weight:800}.light{background:#fff;color:#172033;border:1px solid #d9dee5}.green{background:#087443}.red{background:#b42318}.back{background:#fff;border:1px solid #d9dee5;border-radius:10px;padding:9px}.field{width:100%;padding:12px;border:1px solid #d9dee5;border-radius:11px;margin:6px 0;font:inherit}.task .row{align-items:flex-start;gap:8px}.task input{width:21px;height:21px;margin-top:2px}.task button{border:0;background:none;text-align:left;flex:1;padding:0;font-weight:800}.detail{border-top:1px solid #edf0f3;margin-top:10px;padding-top:10px;font-size:14px}.notice{background:#ecfdf3;color:#166534;border-radius:12px;padding:11px;margin:10px 0;font-size:13px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px;z-index:5}.nav button{border:0;background:none;font-size:12px}.timer{text-align:center;font-size:30px;font-weight:900;padding:18px}.tag{font-size:11px;background:#eef2ff;padding:5px 8px;border-radius:20px}.empty{text-align:center;padding:25px;color:#667085}
</style></head><body><div id="app"></div>
<script>
const REG={
fut11:{name:"Futebol 11",icon:"⚽",doc:"RPO Futebol 11 Seniores 2026/27",page:31,pdf:"https://afl.pt/wp-content/uploads/2026/07/RPO-26-27-FUTEBOL-11-SENIORES_v11.pdf",items:["Dirigir a reunião preparatória","Ação preventiva e pedagógica / fair play","Verificar condições de segurança","Verificar condições técnicas do campo","Fiscalizar normas e deliberações AFL","Elaborar relatório circunstanciado","Comunicar factos transmitidos oficialmente","Vistoriar vestiários/balneários","Consignar denúncias dos delegados dos clubes","Verificar apanha-bolas","Verificar percursos pedonais"]},
futsal:{name:"Futsal",icon:"🟦",doc:"RPO Futsal 2026/27",page:38,pdf:"https://afl.pt/wp-content/uploads/2026/06/AGE-20260627-AVISO-CONVOCATORIO-SIGNED-VF-ERRATA.pdf",items:["Dirigir a reunião preparatória","Ação preventiva e pedagógica / fair play","Verificar condições de segurança do pavilhão","Verificar condições técnicas do campo","Fiscalizar normas e deliberações AFL","Elaborar relatório circunstanciado","Comunicar factos transmitidos oficialmente","Vistoriar vestiários/balneários","Consignar denúncias dos delegados dos clubes","Verificar percursos pedonais"]}};
let state=JSON.parse(localStorage.getItem("afl_v9")||'{"games":[],"current":null}');
let page="home",expanded=null;
function save(){localStorage.setItem("afl_v9",JSON.stringify(state))}
function nav(){return '<div class="nav"><button onclick="home()">🏠<br>Início</button><button onclick="games()">📅<br>Jogos</button><button onclick="regs()">📚<br>Regras</button></div>'}
function render(x){document.getElementById("app").innerHTML='<div class="app">'+x+'</div>'+nav()}
function home(){let g=state.current;render(`<div class="top"><div><div class="muted">AFL • 2026/27</div><div class="title">Delegado AFL</div><div class="muted">V9 • Dia de jogo</div></div><div style="font-size:32px">🛡️</div></div>
<div class="card"><b>${g?g.home+" × "+g.away:"Nenhum jogo selecionado"}</b><div class="muted">${g?REG[g.mode].name+" • "+(g.date||"Sem data"):"Cria ou seleciona um jogo."}</div><button class="btn" onclick="${g?'game()':'games()'}">${g?'⚽ Abrir jogo':'📅 Gerir jogos'}</button></div>
<div class="grid"><div class="card">📋<br><b>Checklist</b><div class="muted">${g?g.checks.filter(Boolean).length+"/"+REG[g.mode].items.length:"—"}</div></div><div class="card">🚨<br><b>Ocorrências</b><div class="muted">${g?g.occs.length:"—"}</div></div></div>`)}
function games(){let list=state.games.map((g,i)=>`<div class="card"><b>${g.home} × ${g.away}</b><div class="muted">${REG[g.mode].name} • ${g.date||"Sem data"} • ${g.place||"Sem local"}</div><button class="btn light" onclick="selectGame(${i})">Abrir</button><button class="btn red" onclick="deleteGame(${i})">🗑️ Apagar jogo</button></div>`).join("");render(`<div class="head"><button class="back" onclick="home()">←</button><div class="h2">📅 Meus Jogos</div></div><button class="btn" onclick="newGame()">➕ Novo jogo</button>${list||'<div class="empty">Ainda não tens jogos.</div>'}`)}
function deleteGame(i){if(!confirm("Apagar este jogo e todos os seus registos?"))return;state.games.splice(i,1);if(!state.games.length)state.current=null;save();games()}\nfunction newGame(g=null,index=-1){g=g||{home:"",away:"",date:"",time:"",place:"",mode:"fut11",checks:[],occs:[],notes:"",started:null,finished:false};render(`<div class="head"><button class="back" onclick="games()">←</button><div class="h2">${index<0?"➕ Novo jogo":"✏️ Editar jogo"}</div></div>
<input id="home" class="field" placeholder="Clube da casa" value="${g.home}"><input id="away" class="field" placeholder="Clube visitante" value="${g.away}"><input id="date" class="field" type="date" value="${g.date}"><input id="time" class="field" type="time" value="${g.time}"><input id="place" class="field" placeholder="🏟️ Local" value="${g.place}"><select id="mode" class="field"><option value="fut11" ${g.mode==="fut11"?"selected":""}>⚽ Futebol 11</option><option value="futsal" ${g.mode==="futsal"?"selected":""}>🟦 Futsal</option></select><button class="btn" onclick="saveGame(${index})">💾 Guardar jogo</button>`)}
function saveGame(i){let old=i>=0?state.games[i]:null;let g={home:homeEl.value,away:awayEl.value,date:dateEl.value,time:timeEl.value,place:placeEl.value,mode:modeEl.value,checks:old?old.checks:[],occs:old?old.occs:[],notes:old?old.notes:"",started:old?old.started:null,finished:false};if(i<0)state.games.push(g);else state.games[i]=g;state.current=g;save();game()}
Object.defineProperty(window,"homeEl",{get(){return document.getElementById("home")}});Object.defineProperty(window,"awayEl",{get(){return document.getElementById("away")}});Object.defineProperty(window,"dateEl",{get(){return document.getElementById("date")}});Object.defineProperty(window,"timeEl",{get(){return document.getElementById("time")}});Object.defineProperty(window,"placeEl",{get(){return document.getElementById("place")}});Object.defineProperty(window,"modeEl",{get(){return document.getElementById("mode")}})
function selectGame(i){state.current=state.games[i];save();game()}
function game(){if(!state.current){games();return}let g=state.current,d=REG[g.mode];if(g.started&&!g.finished){live();return}let s=`<div class="head"><button class="back" onclick="home()">←</button><div class="h2">${d.icon} Dia de Jogo</div></div><div class="card"><b>${g.home} × ${g.away}</b><div class="muted">${d.name} • ${g.date||"Sem data"} • ${g.place||"Sem local"}</div><button class="btn light" onclick="newGame(state.games.indexOf(state.current))">✏️ Editar dados</button></div><div class="notice">Marca a checklist. Abre cada item para consultar a referência regulamentar.</div>`;d.items.forEach((x,i)=>{s+=`<div class="task"><div class="row"><input type="checkbox" ${g.checks[i]?"checked":""} onchange="mark(${i},this.checked)"><button onclick="expanded=${expanded===i?-1:i};game()">${x}<div class="muted">${g.checks[i]?"🟢 Concluído":"⚪ Pendente"}</div></button></div>${expanded===i?`<div class="detail"><b>📖 Regra associada</b><br>${d.doc}<br><span class="muted">Consultar a disposição correspondente no documento oficial da AFL.</span><button class="btn light" onclick="window.open('${d.pdf}#page=${d.page}','_blank')">📄 Abrir regulamentos oficiais AFL</button></div>`:""}</div>`});s+=`<button class="btn green" onclick="startGame()">🟢 Iniciar Jogo</button>`;render(s)}
function mark(i,v){state.current.checks[i]=v;sync();game()}
function sync(){let i=state.games.indexOf(state.current);if(i>=0)state.games[i]=state.current;save()}
function startGame(){state.current.started=Date.now();state.current.finished=false;sync();live()}
function live(){let g=state.current;render(`<div class="head"><button class="back" onclick="home()">←</button><div class="h2">🟢 Jogo em curso</div></div><div class="card"><b>${g.home} × ${g.away}</b><div class="muted">${REG[g.mode].name}</div><div class="timer" id="timer">00:00:00</div></div><div class="grid"><button class="card" onclick="newOcc()">🚨<br><b>Nova ocorrência</b></button><button class="card" onclick="occurrences()">📋<br><b>Ocorrências</b><div class="muted">${g.occs.length} registadas</div></button></div><textarea id="notes" class="field" rows="4" placeholder="📝 Notas durante o jogo">${g.notes||""}</textarea><button class="btn" onclick="saveNotes()">💾 Guardar notas</button><button class="btn red" onclick="finishGame()">🏁 Terminar jogo</button>`);tick()}
function tick(){let el=document.getElementById("timer");if(!el)return;let sec=Math.max(0,Math.floor((Date.now()-state.current.started)/1000));el.textContent=new Date(sec*1000).toISOString().slice(11,19);setTimeout(tick,1000)}
function saveNotes(){state.current.notes=document.getElementById("notes").value;sync();live()}
function newOcc(){render(`<div class="head"><button class="back" onclick="live()">←</button><div class="h2">🚨 Nova ocorrência</div></div><select id="ot" class="field"><option>Segurança</option><option>Comportamento de adepto</option><option>Jogador</option><option>Equipa técnica</option><option>Arbitragem</option><option>Infraestrutura</option><option>Outro</option></select><input id="ol" class="field" placeholder="📍 Local"><textarea id="od" class="field" rows="5" placeholder="📝 Descrição"></textarea><textarea id="om" class="field" rows="3" placeholder="🛡️ Medidas tomadas"></textarea><button class="btn" onclick="saveOcc()">💾 Guardar ocorrência</button>`)}
function saveOcc(){state.current.occs.push({type:ot.value,loc:ol.value,desc:od.value,meas:om.value,time:new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})});sync();live()}
function occurrences(){let g=state.current,s=`<div class="head"><button class="back" onclick="live()">←</button><div class="h2">🚨 Ocorrências</div></div>`;s+=g.occs.length?g.occs.map(o=>`<div class="occ"><span class="tag">${o.time} • ${o.type}</span><p><b>${o.loc||"Local não indicado"}</b></p><div>${o.desc||"Sem descrição"}</div><small>Medidas: ${o.meas||"—"}</small></div>`).join(""):'<div class="empty">Nenhuma ocorrência.</div>';render(s)}
function finishGame(){state.current.finished=true;state.current.finishedAt=Date.now();sync();report()}
function report(){let g=state.current,d=REG[g.mode];render(`<div class="head"><button class="back" onclick="home()">←</button><div class="h2">📄 Relatório</div></div><div class="notice"><b>${g.home} × ${g.away}</b><br>${d.name} • ${g.date||"Sem data"} • ${g.place||"Sem local"}</div><div class="card"><b>Checklist</b><p>${g.checks.filter(Boolean).length}/${d.items.length} concluídas</p><b>Ocorrências</b><p>${g.occs.length} registadas</p><b>Notas</b><p>${g.notes||"Sem notas finais."}</p></div><button class="btn" onclick="games()">📅 Voltar aos jogos</button>`)}
function regs(){render(`<div class="head"><button class="back" onclick="home()">←</button><div class="h2">📚 Regulamentos</div></div><div class="card"><b>⚽ Futebol 11</b><div class="muted">${REG.fut11.doc}</div><button class="btn light" onclick="window.open('${REG.fut11.pdf}#page=31','_blank')">📄 Abrir documentos AFL</button></div><div class="card"><b>🟦 Futsal</b><div class="muted">${REG.futsal.doc}</div><button class="btn light" onclick="window.open('${REG.futsal.pdf}#page=38','_blank')">📄 Abrir documentos AFL</button></div>`)}
window.home=home;window.games=games;window.newGame=newGame;window.deleteGame=deleteGame;window.saveGame=saveGame;window.selectGame=selectGame;window.game=game;window.mark=mark;window.startGame=startGame;window.live=live;window.saveNotes=saveNotes;window.newOcc=newOcc;window.saveOcc=saveOcc;window.occurrences=occurrences;window.finishGame=finishGame;window.report=report;window.regs=regs;home();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
</script></body></html>
